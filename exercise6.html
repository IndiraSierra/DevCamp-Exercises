<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lato"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=PT+Serif"
    />
    <link rel="stylesheet" href="./exercise6.css" type="text/css" />
    <title>Exercise 6. Search Engine</title>
  </head>
  <body>
    <!-- Logo -->
    <section class="logo">
      <div class="logo-image">
        <img src=".//assets/Logo_Indira_Circular.png" alt="Logo" />
      </div>
    </section>

    <!-- Search box -->
    <section class="search-box">
      <div class="search-container">
        <input type="text" placeholder="What's on your mind?..." />
        <button type="submit">Search</button>
      </div>

      <div>
        <p>
        Return to search
      </p>
      </div>
    
    </section>

    <!-- Search text -->
    <section class="search-text">
      

    <!-- footer posts -->
    <section class="footer-posts">
      <div class="footer-post">
        <p>Recent Posts</p>
      </div>
    </section>


  </body>
</html>
